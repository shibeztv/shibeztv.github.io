<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shibez VOD Archive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Syne:wght@400;600&family=DM+Mono:wght@400;500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0d0f;
    --surface: #141417;
    --surface2: #1a1a1e;
    --border: #2a2a30;
    --accent: #7c5cfc;
    --accent2: #fc5c7d;
    --text: #e8e8f0;
    --muted: #6b6b7a;
    --live: #ff4444;
    --mono: 'IBM Plex Mono', monospace;
    --sans: 'Syne', sans-serif;
    --sidebar-w: 340px;
    --topbar-h: 54px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html {
    overflow: hidden;
    height: 100%;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    height: 100%;
    overflow: hidden;
  }

  /* TOPBAR */
  .topbar {
    height: var(--topbar-h);
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 20px;
    gap: 20px;
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 9100;
  }

  .logo {
    font-size: 18px;
    font-weight: 800;
    letter-spacing: -0.5px;
    color: var(--text);
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .logo span {
    color: var(--accent);
  }
 
  .logo-dot.live { background: #ff4040 !important; box-shadow: 0 0 5px #ff4040 !important; animation: pulse 2s infinite; }
  .logo-dot {
    width: 8px; height: 8px;
    background: #555;
    border-radius: 50%;
    box-shadow: none;
    display: inline-block;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(255,64,64,0.5); }
    50% { opacity: 0.7; box-shadow: 0 0 0 4px rgba(255,64,64,0); }
  }

  .topbar-right {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 14px;
  }

  /* LAYOUT */
  .layout {
    display: flex;
    flex-direction: column;
    margin-top: var(--topbar-h);
    height: calc(100vh - var(--topbar-h));
    overflow: hidden;
  }

  /* SIDEBAR */
  .sidebar {
    width: 220px;
    flex-shrink: 0;
    background: var(--surface);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    display: flex;
    flex-direction: column;
  }

  .sidebar::-webkit-scrollbar { width: 4px; }
  *::-webkit-scrollbar { width: 6px; height: 6px; }
  *::-webkit-scrollbar-track { background: transparent; }
  *::-webkit-scrollbar-thumb { background: #2a2e38; border-radius: 3px; }
  *::-webkit-scrollbar-thumb:hover { background: #3a4050; }
  * { scrollbar-width: thin; scrollbar-color: #2a2e38 transparent; }
  .sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .sidebar-section {
    padding: 14px 12px 6px;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .stream-item {
    display: flex;
    flex-direction: column;
    padding: 0;
    cursor: pointer;
    border-bottom: 1px solid var(--border);
    transition: background 0.1s;
    position: relative;
  }
  .stream-item:hover { background: var(--surface2); }
  .stream-item.active { background: #1e1a2e; }
  .stream-item.active::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--accent);
  }

  .stream-thumb-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 16/9;
    overflow: hidden;
    background: #111;
  }
  .stream-thumb-wrap img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }
  .stream-thumb-wrap .thumb-fallback {
    width: 100%; height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
    font-size: 28px;
  }
  .stream-duration {
    position: absolute;
    bottom: 4px; right: 4px;
    background: rgba(0,0,0,0.85);
    font-family: var(--mono);
    font-size: 10px;
    padding: 2px 5px;
    border-radius: 2px;
    color: #fff;
  }

  .stream-info {
    padding: 8px 10px;
  }
  .stream-date {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--accent);
    margin-bottom: 3px;
  }
  
  .stream-title {
    font-size: 12px;
    font-weight: 600;
    line-height: 1.3;
    color: var(--text);
    margin-bottom: 4px;
  }
  .stream-games-mini {
    display: flex;
    flex-wrap: wrap;
    gap: 3px;
  }
  .game-tag-mini {
    font-family: var(--mono);
    font-size: 9px;
    background: rgba(124,92,252,0.15);
    border: 1px solid rgba(124,92,252,0.3);
    color: var(--accent);
    padding: 1px 5px;
    border-radius: 2px;
  }

  /* MAIN CONTENT */
  .main {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .main::-webkit-scrollbar { width: 4px; }
  .main::-webkit-scrollbar-thumb { background: var(--border); }

  /* VIDEO AREA */
  .video-section {
    background: #000;
    position: relative;
  }

  .video-wrapper {
    position: relative;
    padding-bottom: 43%;
    height: 0;
  }
  .video-wrapper iframe {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    border: none;
  }

  .no-video {
    aspect-ratio: 16/9;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 12px;
    background: #080810;
    color: var(--muted);
    font-family: var(--mono);
    font-size: 13px;
  }
  .no-video .icon { font-size: 40px; opacity: 0.3; }

  /* VIDEO META */
  .video-meta {
    padding: 16px 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }

  .video-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 12px;
  }

  .video-title {
    font-size: 18px;
    font-weight: 700;
    line-height: 1.3;
    flex: 1;
  }

  .video-date-badge {
    font-family: var(--mono);
    font-size: 12px;
    color: #bbb;
    white-space: nowrap;
    padding-top: 3px;
  }

  .video-stats {
    display: flex;
    gap: 16px;
    margin-bottom: 12px;
  }
  .stat {
    font-family: var(--mono);
    font-size: 12px;
    color: #bbb;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .stat b { color: var(--text); }

  /* GAME SEGMENTS */
  .segments-label {
    font-family: var(--mono);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #999;
    margin-bottom: 8px;
  }

  .segments {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .segment-btn {
    display: flex;
    align-items: center;
    gap: 7px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 6px 10px;
    cursor: pointer;
    transition: all 0.15s;
    font-family: var(--sans);
    font-size: 12px;
    font-weight: 600;
    color: var(--text);
    white-space: nowrap;
  }
  .segment-btn:hover {
    border-color: var(--accent);
    background: rgba(124,92,252,0.1);
  }
  .segment-btn.active {
    border-color: var(--accent);
    background: rgba(124,92,252,0.18);
    color: var(--accent);
  }
  .segment-time {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
    background: rgba(0,0,0,0.3);
    padding: 1px 5px;
    border-radius: 2px;
  }
  .segment-btn.active .segment-time { color: rgba(124,92,252,0.7); }

  .seg-part-header {
    width: 100%;
    font-family: var(--mono);
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
    padding: 5px 2px 2px;
    border-top: 1px solid var(--border);
    margin-top: 2px;
  }
  .seg-part-header:first-child { border-top: none; margin-top: 0; padding-top: 0; }

  /* TIMELINE BAR */
  .timeline-wrap {
    padding: 0 20px 0;
    background: var(--surface);
    padding-bottom: 14px;
  }
  .timeline-bar {
    height: 6px;
    background: var(--surface2);
    border-radius: 3px;
    display: flex;
    overflow: hidden;
    gap: 1px;
    cursor: pointer;
  }
  .timeline-seg {
    height: 100%;
    transition: filter 0.2s;
    border-radius: 1px;
  }
  .timeline-seg:hover { filter: brightness(1.4); }

  /* TIMELINE LABELS */
  .timeline-labels {
    display: flex;
    width: 100%;
    margin-top: 4px;
  }
  .timeline-label {
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 600;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    cursor: pointer;
    padding: 1px 2px;
    opacity: 0.85;
    transition: opacity 0.15s;
    box-sizing: border-box;
    min-width: 0;
  }
  .timeline-label:hover { opacity: 1; }

  /* MULTI-PART */
  .parts-section {
    display: none;
    flex-direction: column;
    align-items: flex-end;
    gap: 4px;
  }
  .parts-section.visible { display: flex; }
 
  .parts-label {
    font-family: var(--mono);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #bbb;
    margin-bottom: 0;
  }
  .parts-list {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .part-btn {
    font-family: var(--mono);
    font-size: 11px;
    padding: 5px 12px;
    border-radius: 3px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s;
  }
  .part-btn:hover { border-color: var(--accent2); color: var(--text); }
  .part-btn.active {
    border-color: var(--accent2);
    background: rgba(252,92,125,0.1);
    color: var(--accent2);
  }

  /* TWITCH CHAT PANEL */
  .chat-panel {
    width: var(--sidebar-w);
    flex-shrink: 0;
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    background: var(--surface);
    height: 100%;
  }

  .chat-header {
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }
  .chat-header-icon { font-size: 14px; }
  .chat-header-title {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.5px;
    flex: 1;
  }
  .chat-mode-toggle {
    font-family: var(--mono);
    font-size: 9px;
    display: flex;
    gap: 0;
    border: 1px solid var(--border);
    border-radius: 3px;
    overflow: hidden;
  }
  .chat-mode-btn {
    padding: 4px 8px;
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-family: var(--mono);
    font-size: 9px;
    transition: all 0.1s;
  }
  .chat-mode-btn.active { background: var(--accent); color: white; }

  .chat-messages {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 8px 0;
    display: flex;
    flex-direction: column;
    gap: 1px;
    scroll-behavior: smooth;
  }
  .chat-messages::-webkit-scrollbar { width: 3px; }
  .chat-messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .chat-msg {
    padding: 3px 10px;
    font-size: 14px;
    font-family: 'Inter', sans-serif;
    line-height: 1.5;
    word-break: break-word;
    transition: background 0.1s;
  }
 
  .chat-msg:hover { background: rgba(255,255,255,0.03); }
  .chat-msg-time {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
    margin-right: 4px;
    cursor: pointer;
    transition: color 0.12s;
  }
  .chat-msg-time:hover { color: var(--accent); }
  .chat-msg-user {
    font-weight: 700;
    margin-right: 4px;
  }
  .chat-msg-text { color: var(--text); }

  /* EMOTES */
  .chat-badge {
    display: inline-block;
    vertical-align: middle;
    width: 20px; height: 20px;
    margin-right: 2px;
    object-fit: contain;
  }
  /* Remove number input spinners */
  input[type=number]::-webkit-inner-spin-button,
  input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  input[type=number] { -moz-appearance: textfield; appearance: textfield; }

  .chat-emote {
    display: inline-block;
    vertical-align: middle;
    height: 24px;
    width: auto;
    margin: 0 1px;
    image-rendering: auto;
  }
  .chat-emote-animated {
    height: 24px;
  }
  .chat-msg-text a { color: var(--accent); text-decoration: none; }

  .chat-footer {
    padding: 6px 10px;
    border-top: 1px solid var(--border);
    font-family: var(--mono);
    font-size: 9px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }

  .chat-placeholder {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 10px;
    color: var(--muted);
    font-family: var(--mono);
    font-size: 11px;
    padding: 20px;
    text-align: center;
  }
  .chat-placeholder-icon { font-size: 32px; opacity: 0.3; }

  /* CONFIG MODAL */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 1000;
    backdrop-filter: blur(3px);
    align-items: center;
    justify-content: center;
  }
  .modal-overlay.open { display: flex; }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    width: 460px;
    max-width: 95vw;
    overflow: hidden;
  }
  .modal-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .modal-title {
    font-size: 14px;
    font-weight: 700;
  }
  .modal-close {
    background: none; border: none;
    color: var(--muted); cursor: pointer;
    font-size: 18px; line-height: 1;
    transition: color 0.1s;
  }
  .modal-close:hover { color: var(--text); }

  .modal-body { padding: 20px; }

  .field {
    margin-bottom: 16px;
  }
  .field label {
    display: block;
    font-family: var(--mono);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .field input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 9px 12px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 12px;
    transition: border-color 0.15s;
    outline: none;
  }
  .field input:focus { border-color: var(--accent); }
  .field input::placeholder { color: var(--muted); }

  .field-help {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
    margin-top: 5px;
  }

  .modal-footer {
    padding: 14px 20px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 8px;
    justify-content: flex-end;
  }

  .btn {
    font-family: var(--sans);
    font-size: 12px;
    font-weight: 600;
    padding: 8px 16px;
    border-radius: 4px;
    border: 1px solid var(--border);
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn-ghost {
    background: none;
    color: var(--muted);
  }
  .btn-ghost:hover { color: var(--text); border-color: var(--muted); }
  .btn-primary {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
  }
  .btn-primary:hover { filter: brightness(1.1); }

  .stream-status {
    display: flex;
    align-items: center;
    font-family: var(--mono);
    font-size: 11px;
    color: #bbb;
  }
  .live-status { color: #ff6060 !important; }
  .live-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: #ff4040; box-shadow: 0 0 5px #ff4040;
    display: inline-block; animation: pulse 1.2s infinite;
    flex-shrink: 0;
  }

  /* STATUS BAR */
  .status-bar {
    padding: 6px 20px;
    background: var(--surface2);
    border-bottom: 1px solid var(--border);
    font-family: var(--mono);
    font-size: 11px;
    color: #ccc;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .status-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--muted);
    display: inline-block;
  }
  .status-dot.ok { background: #4ade80; }
  .status-dot.error { background: var(--live); }

  /* RESPONSIVE */
  @media (max-width: 1100px) {
    .chat-panel { display: none; }
  }
 
  @media (max-width: 700px) {
    .sidebar { width: 180px; }
  }

  /* LOADING */
  .loader {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    font-family: var(--mono);
    font-size: 18px;
    font-weight: 700;
    color: #fff;
    letter-spacing: 1px;
    gap: 20px;
    z-index: 100;
    pointer-events: none;
  }
  .loader-dots {
    display: flex;
    gap: 8px;
  }
  .loader-dots span {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--accent);
    animation: dotBounce 1.2s ease-in-out infinite;
  }
  .loader-dots span:nth-child(2) { animation-delay: 0.2s; }
  .loader-dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes dotBounce {
    0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
    40% { transform: translateY(-10px); opacity: 1; }
  }

  /* Empty state */
  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 60vh;
    padding: 40px 20px;
    text-align: center;
    color: var(--muted);
    font-family: var(--mono);
    font-size: 12px;
    line-height: 1.8;
    grid-column: 1 / -1;
    width: 100%;
  }
  .empty-state .big { font-size: 40px; margin-bottom: 12px; }

  .streak-badge {
    font-family: var(--mono);
    font-size: 9px;
    background: rgba(252,92,125,0.15);
    border: 1px solid rgba(252,92,125,0.3);
    color: var(--accent2);
    padding: 2px 6px;
    border-radius: 2px;
    margin-left: 6px;
  }

  #spaceModal *::-webkit-scrollbar { width: 0; height: 0; }

  #egSuggest::-webkit-scrollbar { width: 4px; }
  #egSuggest::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  #egSuggest::-webkit-scrollbar-track { background: transparent; }

  @keyframes holCheckPop {
    0%   { transform: scale(0.4); opacity: 0; }
    60%  { transform: scale(1.15); opacity: 1; }
    100% { transform: scale(1.0); opacity: 1; }
  }
  @keyframes holCheckFade {
    0%   { opacity: 1; transform: scale(1.0); }
    100% { opacity: 0; transform: scale(0.8); }
  }
  .space-emote-overlay {
    position: absolute;
    pointer-events: none;
    image-rendering: auto;
    will-change: transform;
    display: none;
    border-radius: 50%;
    overflow: hidden;
  }
 
  #spaceModal { scrollbar-width: none; }
  /* THEATER MODE */
  .theater-btn-wrap {
    display: none;
    position: absolute;
    top: 8px;
    right: 8px;
    z-index: 20;
  }
  .theater-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.5px;
    background: var(--surface2);
    border: 1px solid #444;
    color: var(--text);
    padding: 7px 16px;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .theater-btn:hover { border-color: var(--accent); background: rgba(124,92,252,0.15); color: var(--accent); }
  .theater-btn.active { border-color: var(--accent); background: rgba(124,92,252,0.2); color: var(--accent); }
  .theater-btn svg { width: 14px; height: 14px; flex-shrink: 0; }

  /* Theater mode rules */
  body.theater .topbar { display: none; }
  body.theater .layout { height: 100vh; margin-top: 0; display: flex; flex-direction: column; }
  body.theater #gridView { display: none !important; }
  body.theater .player-view { flex: 1; display: flex !important; flex-direction: column; overflow: hidden; }
  body.theater .player-topbar { display: none !important; }
  body.theater #theaterBtnWrap { display: none !important; }
  body.theater #theaterBarWrap { display: none !important; }
  body.theater .player-view > div[style*="display:flex"] { flex: 1; overflow: hidden; }

  .player-view.active { display: flex; overflow: hidden; }

  body.theater .main {
    flex: 1; overflow: hidden;
    display: flex; flex-direction: column;
  }
  body.theater .video-content-wrap {
    flex: 1; display: flex; flex-direction: column; overflow: hidden;
  }
  body.theater .video-section {
    flex: 1; display: flex; flex-direction: column; overflow: hidden;
  }
  body.theater .video-wrapper {
    flex: 1; padding-bottom: 0 !important; height: 100% !important; position: relative !important;
  }
  body.theater .video-wrapper iframe,
  body.theater #ytPlayerEl,
  body.theater #ytPlayerEl iframe {
    position: absolute !important;
    top: 0; left: 0;
    width: 100% !important; height: 100% !important;
  }
  body.theater .video-meta { display: none !important; }
  body.theater .player-footer { display: none !important; }
  body.theater .timeline-wrap { display: none !important; }
  body.theater .parts-section { display: none !important; }
  body.theater .status-bar { display: none !important; }
  body.theater .chat-panel { display: flex !important; width: 320px; flex-shrink: 0; }
  body.theater .resize-handle,
  .player-view.active .resize-handle { display: block; }

  /* ── GRID HOME ─────────────────────────────────────────────────── */
  .grid-view {
    flex: 1;
    overflow-y: auto;
    padding: 24px 20px;
    background: var(--bg);
  }
  .grid-view::-webkit-scrollbar { width: 4px; }
  .grid-view::-webkit-scrollbar-thumb { background: var(--border); }

  .grid-header {
    margin-top: 14px;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .grid-header-title {
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 0.5px;
    color: var(--text);
  }
  .grid-header-count {
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 700;
    color: #bbb;
  }

  .stream-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 14px;
  }

  .grid-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
    cursor: pointer;
    transition: border-color 0.15s, transform 0.1s, box-shadow 0.15s;
  }
  .grid-card:hover {
    border-color: var(--accent);
    outline: 2px solid var(--accent);
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(0,0,0,0.3);
  }
  .grid-card-thumb {
    position: relative;
    width: 100%;
    aspect-ratio: 16/9;
    background: #080810;
    overflow: hidden;
  }
  .grid-card-thumb img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.2s;
  }
  .grid-card:hover .grid-card-thumb img { transform: scale(1.03); }
  
  .grid-card-thumb .thumb-fallback {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    font-size: 28px;
    background: linear-gradient(135deg, #1a1a2e 0%, #0e0e1a 100%);
